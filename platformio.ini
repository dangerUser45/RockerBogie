[env:main]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
extra_scripts = pre:tools/embed_html.py

lib_deps =
  ESP32Async/ESPAsyncWebServer
  ESP32Async/AsyncTCP
  arduino-libraries/Arduino_JSON
  adafruit/Adafruit PWM Servo Driver Library
  adafruit/Adafruit BusIO

[env:main_ota]
extends = env:main
upload_protocol = espota
upload_port = 10.0.0.1
upload_flags =
  --auth=12345678

[env:motor_test]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

; Собираем ТОЛЬКО эти файлы:
build_src_filter =
    +<../test/motor_test/src/main.cpp>
    +<../test/motor_test/src/motor.cpp>
    -<*>

; Добавляем include-папку для заголовков
build_flags =
    -I test/motor_test/include

[env:I2C_scanner_test]
platform = espressif32                       
board = esp32dev                  
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

; Собираем ТОЛЬКО эти файлы:
build_src_filter =
    +<../test/i2c_scanner/main.cpp>
    -<*>
